<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Dashboard - Infiloocast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="text-center md:text-left">
                <h1 id="station-name" class="text-4xl font-bold tracking-tight text-white uppercase">Infiloocast</h1>
                <p id="station-tagline" class="text-slate-400">Live Broadcast Dashboard</p>
            </div>
            <div class="flex items-center gap-3 bg-slate-800/50 px-4 py-2 rounded-full border border-slate-700">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-sm font-medium">LIVE</span>
                <span class="text-slate-500">|</span>
                <span id="listener-count" class="text-sm font-bold">0 Listeners</span>
            </div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Now Playing Card -->
            <div class="md:col-span-2 glass-card rounded-3xl p-8 flex flex-col md:flex-row gap-8 items-center">
                <div class="relative group">
                    <img id="artist-image" src="https://via.placeholder.com/300" alt="Album Art" 
                         class="w-48 h-48 md:w-56 md:h-56 rounded-2xl object-cover shadow-2xl transition-transform duration-500 group-hover:scale-105 border border-slate-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent rounded-2xl"></div>
                </div>

                <div class="flex-1 space-y-4 text-center md:text-left w-full">
                    <div>
                        <span class="text-blue-400 text-xs font-bold uppercase tracking-widest">Now Playing</span>
                        <h2 id="song-title" class="text-3xl font-bold mt-1 leading-tight">Loading...</h2>
                        <p id="artist-name" class="text-xl text-slate-300">Please wait</p>
                    </div>

                    <div class="space-y-2">
                        <div class="flex justify-between text-xs text-slate-400 font-medium">
                            <span id="time-current">0:00</span>
                            <span id="time-total">0:00</span>
                        </div>
                        <div class="h-2 w-full bg-slate-700 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-blue-500 progress-glow transition-all duration-1000 ease-linear" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="flex flex-wrap justify-center md:justify-start gap-4 pt-2">
                        <!-- Stream Player Button -->
                        <button id="play-btn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold transition-all btn-glow active:scale-95">
                            <i id="play-icon" class="fa-solid fa-play"></i>
                            <span id="play-text">LISTEN NOW</span>
                        </button>
                        
                        <div class="flex items-center gap-4 ml-2">
                            <div class="flex items-center gap-2 text-slate-400 text-sm">
                                <i class="fa-solid fa-compact-disc"></i>
                                <span id="album-name">...</span>
                            </div>
                            <div class="flex items-center gap-2 text-slate-400 text-sm">
                                <i class="fa-solid fa-calendar"></i>
                                <span id="release-year">...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats & Meta -->
            <div class="space-y-6">
                <div class="glass-card rounded-3xl p-6 h-full flex flex-col justify-between">
                    <div>
                        <h3 class="text-slate-400 text-sm font-semibold uppercase mb-4">Station Info</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <span class="text-slate-500 text-sm">Genre</span>
                                <span id="song-genre" class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-lg text-xs font-bold uppercase">...</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-500 text-sm">Listeners</span>
                                <span class="font-mono text-lg" id="stat-listeners">0</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-slate-700/50">
                        <p class="text-xs text-slate-500 mb-4 uppercase font-bold">Station Link</p>
                        <a id="laut-url" href="#" target="_blank" class="flex items-center justify-center p-4 bg-slate-800 rounded-xl hover:bg-slate-700 transition-all hover:scale-[1.02] active:scale-[0.98] border border-slate-700">
                            <i class="fa-solid fa-globe text-2xl text-blue-400 mr-3"></i>
                            <span class="font-semibold text-sm">Visit laut.fm</span>
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center text-slate-600 text-xs py-4">
            Data provided by laut.fm API &bull; Updates every 10 seconds
        </footer>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="radio-stream" preload="none">
        <source src="https://stream.laut.fm/infiloocast" type="audio/mpeg">
    </audio>

    <script>
        const STATION_NAME = 'infiloocast';
        const API_BASE = 'https://api.laut.fm';

        let currentSongData = null;
        const audio = document.getElementById('radio-stream');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');

        // Playback Control
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.replace('fa-play', 'fa-stop');
                playText.textContent = 'STOP STREAM';
                playBtn.classList.replace('bg-blue-600', 'bg-red-600');
                playBtn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
            } else {
                audio.pause();
                audio.src = audio.src; // Reset stream to live
                playIcon.classList.replace('fa-stop', 'fa-play');
                playText.textContent = 'LISTEN NOW';
                playBtn.classList.replace('bg-red-600', 'bg-blue-600');
                playBtn.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
            }
        });

        async function fetchData() {
            try {
                const songRes = await fetch(`${API_BASE}/station/${STATION_NAME}/current_song`);
                const songData = await songRes.json();
                updateNowPlaying(songData);

                const listenerRes = await fetch(`${API_BASE}/station/${STATION_NAME}/listeners`);
                const listeners = await listenerRes.json();
                updateListeners(listeners);

            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function updateNowPlaying(data) {
            currentSongData = data;
            
            document.getElementById('song-title').textContent = data.title;
            document.getElementById('artist-name').textContent = data.artist.name;
            document.getElementById('album-name').textContent = data.album || 'Unknown Album';
            document.getElementById('release-year').textContent = data.releaseyear || 'N/A';
            document.getElementById('song-genre').textContent = data.genre || 'Various';
            
            const artImg = document.getElementById('artist-image');
            artImg.src = data.artist.image || 'https://via.placeholder.com/300?text=No+Image';
            
            document.getElementById('laut-url').href = data.artist.laut_url || `https://laut.fm/${STATION_NAME}`;

            updateProgress();
        }

        function updateListeners(count) {
            document.getElementById('listener-count').textContent = `${count} ${count === 1 ? 'Listener' : 'Listeners'}`;
            document.getElementById('stat-listeners').textContent = count;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function parseLautDate(dateStr) {
            return new Date(dateStr.replace(' ', 'T').replace(' ', ''));
        }

        function updateProgress() {
            if (!currentSongData) return;

            const now = new Date();
            const start = parseLautDate(currentSongData.started_at);
            const end = parseLautDate(currentSongData.ends_at);
            
            const total = (end - start) / 1000;
            const elapsed = (now - start) / 1000;
            const percentage = Math.min(Math.max((elapsed / total) * 100, 0), 100);

            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('time-current').textContent = formatTime(Math.max(elapsed, 0));
            document.getElementById('time-total').textContent = formatTime(total);

            if (percentage >= 100) {
                fetchData();
            }
        }

        setInterval(fetchData, 10000);
        setInterval(updateProgress, 1000);

        window.onload = fetchData;
    </script>
</body>
</html>
